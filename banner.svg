<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Jhonatan Fuentes - Desarrollador full stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220">
        <animate attributeName="stop-color" values="#0B1220;#1E1B4B;#042F2E;#3B0764;#0B1220" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#1D4ED8">
        <animate attributeName="stop-color" values="#1D4ED8;#7C3AED;#0E7490;#BE185D;#1D4ED8" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#C026D3;#14B8A6;#F472B6;#3B82F6" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card">
      <rect width="1000" height="240" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#dots)" opacity="0.08"/>

    <circle cx="170" cy="40" r="170" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;60 30;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="210" r="200" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-70 -25;0 0" dur="18s" repeatCount="indefinite"/>
    </circle>

    <g font-family="Consolas, 'Cascadia Code', Menlo, monospace" font-weight="700" fill="#FFFFFF" opacity="0.10">
      <text x="48" y="150" font-size="96">&lt;/&gt;</text>
      <text x="830" y="112" font-size="88">{ }</text>
    </g>

    <g font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF" text-anchor="middle">
      <text x="500" y="112" font-size="60" font-weight="700" letter-spacing="1">Jhonatan Fuentes</text>
      <text x="500" y="152" font-size="22" font-weight="500" opacity="0.92">Desarrollador full stack &#183; .NET &#183; React &#183; PostgreSQL</text>
    </g>

    <rect x="440" y="176" width="120" height="4" rx="2" fill="#FFFFFF" opacity="0.55">
      <animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="480;440;480" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
