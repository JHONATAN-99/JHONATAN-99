<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" aria-hidden="true">
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8">
        <animate attributeName="stop-color" values="#1D4ED8;#7C3AED;#0E7490;#BE185D;#1D4ED8" dur="16s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#C026D3;#14B8A6;#F472B6;#3B82F6" dur="16s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <path fill="url(#wave)" opacity="0.35">
    <animate attributeName="d" dur="10s" repeatCount="indefinite"
      values="M0 50 C 250 20, 450 80, 1000 40 L1000 90 L0 90 Z;
              M0 40 C 300 80, 600 10, 1000 55 L1000 90 L0 90 Z;
              M0 50 C 250 20, 450 80, 1000 40 L1000 90 L0 90 Z"/>
  </path>
  <path fill="url(#wave)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 65 C 300 45, 600 90, 1000 60 L1000 90 L0 90 Z;
              M0 60 C 250 85, 700 40, 1000 70 L1000 90 L0 90 Z;
              M0 65 C 300 45, 600 90, 1000 60 L1000 90 L0 90 Z"/>
  </path>
</svg>
